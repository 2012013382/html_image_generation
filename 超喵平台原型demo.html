<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>超喵 · 端到端产品原型 · Demo v1</title>
<style>
/* ============ 设计系统 ============ */
:root {
  --navy: #1E2761;
  --navy-deep: #0F1835;
  --navy-soft: #2E3B7A;
  --accent: #F04E23;
  --accent-soft: #FFE8E0;
  --accent-deep: #C03A17;
  --ink: #1A1A2E;
  --ink-soft: #3B3F52;
  --muted: #6B7280;
  --muted-soft: #94A3B8;
  --line: #E2E7F3;
  --line-dark: #C8D0E3;
  --bg: #F6F7FB;
  --pale: #EEF1F8;
  --white: #FFFFFF;
  --success: #10B981;
  --success-soft: #D1FAE5;
  --warning: #F59E0B;
  --warning-soft: #FEF3C7;
  --danger: #DC2626;
  --danger-soft: #FEE2E2;
  --info: #0891B2;
  --info-soft: #CFFAFE;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(15,24,53,.06);
  --shadow-md: 0 4px 12px rgba(15,24,53,.08);
  --shadow-lg: 0 10px 30px rgba(15,24,53,.12);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', system-ui, -apple-system, sans-serif;
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  overflow: hidden;
}
button { font-family: inherit; cursor: pointer; border: none; }
input, textarea { font-family: inherit; }

#app {
  height: 100vh;
  display: grid;
  grid-template-rows: 56px 48px 1fr;
}

/* ============ 顶部 AppBar ============ */
.topbar {
  background: var(--navy-deep);
  color: #fff;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 20px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.topbar .brand { display: flex; align-items: center; gap: 10px; }
.topbar .logo {
  width: 32px; height: 32px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent) 0%, #E0390C 100%);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; color: #fff;
}
.topbar .name { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
.topbar .tag {
  padding: 3px 8px; background: rgba(240,78,35,0.15);
  color: #FFB199; border-radius: 4px;
  font-size: 11px; letter-spacing: 0.3px;
}
.topbar .role-indicator {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: rgba(255,255,255,0.08);
  border-radius: 20px; font-size: 13px;
}
.topbar .role-icon { font-size: 16px; }
.topbar .role-name { color: #CADCFC; }
.topbar .controls { display: flex; gap: 8px; }
.btn {
  padding: 7px 14px; border-radius: 6px; font-size: 13px;
  font-weight: 500; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-primary {
  background: var(--accent); color: #fff;
}
.btn-primary:hover { background: var(--accent-deep); }
.btn-primary:disabled { background: #6B5B54; cursor: not-allowed; }
.btn-ghost {
  background: rgba(255,255,255,0.08); color: #CADCFC;
}
.btn-ghost:hover { background: rgba(255,255,255,0.15); color: #fff; }
.btn-ghost:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-outline {
  background: transparent; border: 1px solid var(--line-dark);
  color: var(--ink-soft);
}
.btn-outline:hover { background: var(--pale); }

/* ============ 剧情 storybar ============ */
.storybar {
  background: #fff;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: stretch;
  padding: 0 20px;
  font-size: 12px;
}
.story-act {
  flex: 1; display: flex; align-items: center; justify-content: center;
  gap: 8px; color: var(--muted); position: relative;
  padding: 0 8px;
}
.story-act .num {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--pale); color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600;
  transition: all 0.3s;
}
.story-act.active { color: var(--accent); font-weight: 600; }
.story-act.active .num { background: var(--accent); color: #fff; }
.story-act.passed { color: var(--navy); }
.story-act.passed .num { background: var(--navy); color: #fff; }
.story-act:not(:last-child)::after {
  content: ''; position: absolute; right: -1px; top: 50%;
  transform: translateY(-50%);
  width: 1px; height: 24px; background: var(--line);
}

/* ============ Stage（舞台区域） ============ */
#stage {
  overflow: hidden;
  position: relative;
}
.scene {
  height: 100%; overflow: auto;
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
@keyframes slideInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes expand {
  from { opacity: 0; max-height: 0; }
  to { opacity: 1; max-height: 800px; }
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}

/* ============ Narrator（右下角旁白浮窗） ============ */
.narrator {
  position: fixed; right: 20px; bottom: 20px;
  width: 320px; padding: 14px 16px;
  background: var(--navy-deep); color: #fff;
  border-radius: var(--radius-md);
  border-left: 3px solid var(--accent);
  box-shadow: var(--shadow-lg);
  z-index: 100;
  font-size: 12.5px; line-height: 1.6;
  animation: slideInUp 0.4s ease-out;
}
.narrator .nar-title {
  color: var(--accent); font-weight: 600;
  font-size: 11px; letter-spacing: 0.5px;
  text-transform: uppercase; margin-bottom: 6px;
}
.narrator .nar-body { color: #E2E7F3; }
.narrator .nar-close {
  position: absolute; top: 8px; right: 10px;
  background: transparent; color: #94A3B8;
  font-size: 16px; padding: 0; line-height: 1;
}
.narrator .nar-close:hover { color: #fff; }

/* ============ 场景公共样式 ============ */
.scene-wrap {
  max-width: 1400px; margin: 0 auto;
  padding: 24px;
  height: 100%;
}
.scene-grid-3 {
  display: grid; gap: 16px; height: 100%;
  grid-template-columns: 260px 1fr 340px;
}
.scene-grid-2 {
  display: grid; gap: 20px;
  grid-template-columns: 240px 1fr;
  height: 100%;
}
.scene-grid-2 > .xiao-main {
  display: flex; flex-direction: column;
  min-height: 0;
}
.scene-grid-2 .xiao-main .xm-scroll {
  flex: 1 1 auto; overflow: auto;
  padding-right: 4px;
}
.scene-grid-leader {
  display: grid; gap: 20px; height: 100%;
  grid-template-columns: 1fr 340px;
}
.scene-grid-leader > .leader-main {
  display: flex; flex-direction: column;
  min-height: 0;
}
.scene-grid-leader .leader-main .lm-scroll {
  flex: 1 1 auto; overflow: auto;
  padding-right: 4px;
}

/* ============ 自然语言 chat 输入框（Leader / 小二 通用） ============ */
.chat-bar {
  flex-shrink: 0;
  margin-top: 14px;
  background: #fff;
  border: 1.5px solid var(--line-dark);
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.05);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.chat-bar:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240,78,35,0.12);
}
.chat-bar .ch-row {
  display: flex; align-items: flex-end; gap: 8px;
}
.chat-bar .ch-role-label {
  font-size: 11px; color: var(--muted); font-weight: 600;
  padding: 6px 10px; background: var(--pale);
  border-radius: 10px;
  flex-shrink: 0;
  white-space: nowrap;
}
.chat-bar textarea {
  flex: 1; resize: none; border: none; outline: none;
  font-size: 13.5px; line-height: 1.55;
  color: var(--ink); background: transparent;
  padding: 6px 2px;
  min-height: 24px; max-height: 100px;
  font-family: inherit;
}
.chat-bar textarea::placeholder {
  color: var(--muted-soft);
  font-size: 13px;
}
.chat-bar .ch-send {
  flex-shrink: 0; width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--accent); color: #fff; border: none;
  cursor: pointer; font-size: 15px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.chat-bar .ch-send:hover { background: #D84420; }
.chat-bar .ch-hints {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.chat-bar .ch-hint {
  font-size: 11.5px; color: var(--muted);
  padding: 3px 10px; border: 1px solid var(--line);
  border-radius: 12px; background: #FAFBFE;
  cursor: pointer; transition: all 0.15s;
  white-space: nowrap;
}
.chat-bar .ch-hint.urgent {
  color: var(--danger);
  border-color: #FFD3C7;
  background: #FFF8F7;
}
.chat-bar .ch-hint:hover {
  border-color: var(--accent); color: var(--accent);
  background: var(--accent-soft);
}

/* ============ 卡片/面板 ============ */
.panel {
  background: #fff; border-radius: var(--radius-md);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}
.panel-header {
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  background: #FAFBFE;
}
.panel-title {
  font-size: 13px; font-weight: 600; color: var(--ink);
  display: flex; align-items: center; gap: 8px;
}
.panel-body { padding: 16px; }

/* ============ 左侧导航 ============ */
.side-nav {
  background: #fff; border-right: 1px solid var(--line);
  padding: 16px 0;
  display: flex; flex-direction: column; gap: 2px;
  border-radius: var(--radius-md);
}
.nav-section-label {
  padding: 8px 16px 4px; font-size: 10.5px;
  text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--muted-soft); font-weight: 600;
}
.nav-item {
  padding: 9px 16px; display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--ink-soft);
  cursor: pointer; transition: all 0.15s;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: var(--pale); }
.nav-item.active {
  background: var(--accent-soft); color: var(--accent-deep);
  border-left-color: var(--accent); font-weight: 600;
}
.nav-item .icon {
  width: 18px; height: 18px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}

/* ============ 芯片/标签 ============ */
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 500;
  line-height: 1.6;
}
.chip-navy { background: var(--navy); color: #fff; }
.chip-accent { background: var(--accent); color: #fff; }
.chip-success { background: var(--success-soft); color: var(--success); }
.chip-warning { background: var(--warning-soft); color: var(--warning); }
.chip-danger { background: var(--danger-soft); color: var(--danger); }
.chip-info { background: var(--info-soft); color: var(--info); }
.chip-muted { background: var(--pale); color: var(--muted); }
.chip-outline {
  background: transparent; border: 1px solid var(--line-dark);
  color: var(--ink-soft);
}

/* ============ Agent 头像 ============ */
.agent-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
  border: 2px solid transparent;
}
.agent-avatar.octopus {
  background: linear-gradient(135deg, var(--accent) 0%, #E0390C 100%);
  color: #fff;
}
.agent-avatar.expert {
  background: linear-gradient(135deg, var(--navy-soft) 0%, var(--navy) 100%);
  color: #fff;
}
.agent-avatar.thinking {
  animation: pulse 1.6s ease-in-out infinite;
  border-color: var(--accent);
}
.agent-avatar.sm { width: 28px; height: 28px; font-size: 14px; }
.agent-avatar.lg { width: 48px; height: 48px; font-size: 22px; }

/* ============ 消息气泡（任务线程） ============ */
.thread { display: flex; flex-direction: column; gap: 14px; padding: 4px; }
.msg {
  display: flex; gap: 12px;
  animation: slideInUp 0.4s ease-out;
}
.msg .msg-body {
  flex: 1; background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius-md); overflow: hidden;
}
.msg-meta {
  padding: 8px 14px; background: #FAFBFE;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
}
.msg-meta .name { font-weight: 600; color: var(--ink); }
.msg-meta .role { color: var(--muted); }
.msg-meta .time { margin-left: auto; color: var(--muted-soft); font-size: 11px; }
.msg-content { padding: 14px; }
.msg.octopus .msg-body { border-left: 3px solid var(--accent); }
.msg.expert .msg-body { border-left: 3px solid var(--navy); }
.msg.system .msg-body { border-left: 3px solid var(--info); }
.msg.conflict .msg-body {
  border: 2px solid var(--warning);
  background: var(--warning-soft);
}
.msg.conflict .msg-meta { background: var(--warning); color: #fff; }
.msg.conflict .msg-meta .name,
.msg.conflict .msg-meta .role { color: #fff; }

/* ============ 专家建议卡结构化字段 ============ */
.expert-field {
  margin-bottom: 10px;
}
.expert-field:last-child { margin-bottom: 0; }
.ef-label {
  font-size: 11px; color: var(--muted); letter-spacing: 0.3px;
  font-weight: 600; text-transform: uppercase;
  margin-bottom: 4px;
}
.ef-value {
  font-size: 13px; color: var(--ink); line-height: 1.6;
}

/* ============ 确认卡 ============ */
.confirm-card {
  border: 2px solid var(--accent);
  background: linear-gradient(180deg, var(--accent-soft) 0%, #fff 50%);
  border-radius: var(--radius-md);
  padding: 16px;
  margin: 10px 0;
}
.confirm-card .cc-title {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600; color: var(--accent-deep);
  margin-bottom: 10px;
}
.confirm-card .cc-actions {
  display: flex; gap: 10px; margin-top: 14px;
}

/* ============ 执行进度（右栏） ============ */
.exec-item {
  padding: 12px 14px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); margin-bottom: 10px;
  background: #fff;
  animation: slideInRight 0.4s ease-out;
}
.exec-item .ex-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.exec-item .ex-name { font-size: 12.5px; font-weight: 600; }
.exec-item .ex-status { margin-left: auto; font-size: 11px; }
.exec-item.running { border-color: var(--info); background: #F0FAFF; }
.exec-item.done { border-color: var(--success); background: #F0FDF4; }
.exec-item.done .ex-status { color: var(--success); font-weight: 600; }
.exec-item.pending .ex-status { color: var(--muted); }
.exec-item.running .ex-status { color: var(--info); font-weight: 600; }
.progress-bar {
  height: 4px; background: var(--pale); border-radius: 2px; overflow: hidden;
  margin-top: 6px;
}
.progress-bar .fill {
  height: 100%; background: var(--info);
  transition: width 1.2s ease;
}
.exec-item.done .fill { background: var(--success); }
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid transparent; border-top-color: currentColor;
  border-right-color: currentColor; border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

/* ============ Leader 指挥台特色样式 ============ */
.goal-input {
  background: #fff; border: 2px solid var(--line);
  border-radius: var(--radius-md); padding: 20px;
  transition: border-color 0.2s;
}
.goal-input:focus-within { border-color: var(--accent); }
.goal-input textarea {
  width: 100%; border: none; outline: none;
  font-size: 16px; resize: none;
  color: var(--ink); line-height: 1.6;
  padding: 0; background: transparent;
}
.goal-input textarea::placeholder { color: var(--muted-soft); }

.strategy-card {
  border: 2px solid var(--line); border-radius: var(--radius-md);
  padding: 16px; cursor: pointer;
  background: #fff; transition: all 0.2s;
  position: relative;
}
.strategy-card:hover { border-color: var(--line-dark); transform: translateY(-2px); }
.strategy-card.selected {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 3px rgba(240,78,35,0.1);
}
.strategy-card .sc-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.strategy-card .sc-num {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--navy); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.strategy-card.selected .sc-num { background: var(--accent); }
.strategy-card .sc-title { font-size: 15px; font-weight: 600; }
.strategy-card .sc-tag { margin-left: auto; }
.strategy-card .sc-metric {
  display: flex; gap: 12px; margin-top: 12px;
  padding-top: 12px; border-top: 1px dashed var(--line);
}
.strategy-card .sc-metric > div {
  flex: 1;
}
.strategy-card .sc-metric .label {
  font-size: 10.5px; color: var(--muted); margin-bottom: 2px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.strategy-card .sc-metric .value { font-size: 15px; font-weight: 600; color: var(--ink); }
.strategy-card .sc-metric .value.accent { color: var(--accent); }
.strategy-card .sc-radio {
  position: absolute; top: 16px; right: 16px;
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid var(--line-dark); background: #fff;
  display: flex; align-items: center; justify-content: center;
}
.strategy-card.selected .sc-radio {
  border-color: var(--accent); background: var(--accent);
}
.strategy-card.selected .sc-radio::after {
  content: '✓'; color: #fff; font-size: 13px; font-weight: 700;
}

/* ============ 专家建议卡（可点击展开详情，建立信任度） ============ */
.expert-row {
  border: 1px solid var(--line); border-radius: var(--radius-md);
  background: #fff; overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.expert-row.ready .exr-head { cursor: pointer; }
.expert-row.ready:hover { border-color: var(--line-dark); }
.expert-row.expanded {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(240,78,35,0.08);
}
.expert-row .exr-head {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
}
.expert-row .exr-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--muted);
  flex-shrink: 0;
}
.expert-row .exr-caret {
  font-size: 22px; color: var(--muted); font-weight: 300;
  flex-shrink: 0; width: 16px; text-align: center;
  transition: transform 0.25s, opacity 0.2s;
  transform: rotate(90deg);
}
.expert-row.expanded .exr-caret { transform: rotate(-90deg); }
.expert-row .exr-detail {
  max-height: 0; overflow: hidden;
  transition: max-height 0.35s ease;
  background: #FAFBFE;
  border-top: 0 solid transparent;
}
.expert-row.expanded .exr-detail {
  max-height: 600px;
  border-top: 1px solid var(--line);
}
.expert-row .exr-detail-inner {
  padding: 14px 16px;
}
.exd-row { margin-bottom: 10px; }
.exd-label {
  font-size: 10.5px; color: var(--muted); font-weight: 600;
  letter-spacing: 0.5px; text-transform: uppercase;
  margin-bottom: 4px;
}
.exd-value { font-size: 12.5px; color: var(--ink); line-height: 1.65; }
.exd-list { margin: 0; padding-left: 18px; }
.exd-list li { margin-bottom: 3px; }
.exd-grid {
  display: grid; grid-template-columns: 1.4fr 1.4fr 1fr; gap: 14px;
  padding-top: 10px; margin-top: 4px;
  border-top: 1px dashed var(--line);
}
.exd-confidence {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--ink);
}
.exd-conf-bar {
  flex: 1; height: 6px;
  background: var(--pale); border-radius: 3px;
  overflow: hidden;
}
.exd-conf-bar .fill {
  height: 100%; background: var(--success);
  border-radius: 3px;
}

/* ============ 任务场景：专家卡片（可折叠以建立信任度） ============ */
.msg.expert.collapsible .msg-body {
  transition: box-shadow 0.2s, border-color 0.2s;
}
.msg.expert.collapsible .msg-meta {
  padding: 10px 14px;
  border-bottom: 1px solid transparent;
  transition: background-color 0.2s, border-color 0.2s;
}
.msg.expert.collapsible .msg-meta:hover {
  background: var(--pale);
}
.msg.expert.collapsible.expanded .msg-meta {
  border-bottom-color: var(--line);
}
.msg.expert.collapsible .msg-collapsible-body {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s ease;
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
.msg.expert.collapsible.expanded .msg-collapsible-body {
  max-height: 1200px;
  opacity: 1;
  padding-top: 14px !important;
  padding-bottom: 14px !important;
}
.msg.expert.collapsible .exr-caret {
  transition: transform 0.25s ease, color 0.2s ease;
  transform: rotate(90deg);
  font-weight: 300;
}
.msg.expert.collapsible.expanded .exr-caret {
  transform: rotate(-90deg);
  color: var(--accent) !important;
}
.msg.expert.collapsible.expanded .msg-body {
  border-color: rgba(240,78,35,0.28);
  box-shadow: 0 0 0 3px rgba(240,78,35,0.06);
}

/* ============ KPI 自动接入 / Gap 识别 卡片 ============ */
.kpi-row {
  display: grid; grid-template-columns: 1.6fr 0.8fr 1fr 1.4fr 0.9fr;
  gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: #fff;
  margin-top: 8px; font-size: 12.5px;
}
.kpi-row.gap-critical { border-color: var(--danger); background: #FFF8F7; }
.kpi-row.gap-warning  { border-color: var(--warning); background: #FFFBF0; }
.kpi-row.gap-ok       { border-color: var(--success); background: #F4FCF6; }
.kpi-row .kp-name { font-weight: 600; color: var(--ink); }
.kpi-row .kp-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }
.kpi-row .kp-val  { font-variant-numeric: tabular-nums; font-weight: 600; }
.kpi-row .kp-bar {
  position: relative; height: 6px; border-radius: 3px;
  background: var(--pale); overflow: hidden;
}
.kpi-row .kp-bar .fill {
  position: absolute; left: 0; top: 0; bottom: 0;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent) 100%);
  border-radius: 3px;
}
.kpi-row.gap-critical .kp-bar .fill { background: var(--danger); }
.kpi-row.gap-warning  .kp-bar .fill { background: var(--warning); }
.kpi-row.gap-ok       .kp-bar .fill { background: var(--success); }
.kpi-row .kp-gap { font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi-row.gap-critical .kp-gap { color: var(--danger); }
.kpi-row.gap-warning  .kp-gap { color: var(--warning); }
.kpi-row.gap-ok       .kp-gap { color: var(--success); }
.kpi-row .kp-tag { justify-self: end; }

.gap-highlight {
  background: linear-gradient(180deg, #FFF3F0 0%, #fff 100%);
  border: 1px solid #FFD3C7; border-radius: var(--radius-md);
  padding: 14px 16px; margin-top: 12px;
  display: flex; gap: 12px; align-items: flex-start;
}
.gap-highlight .gh-icon {
  width: 34px; height: 34px; border-radius: 8px;
  background: var(--danger); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.gap-highlight .gh-title { font-weight: 700; color: var(--ink); font-size: 14px; }
.gap-highlight .gh-body  { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin-top: 4px; }

.auto-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: linear-gradient(90deg, #FFF6E9 0%, #FFF 100%);
  border: 1px solid #F6D98E;
  font-size: 12.5px; color: var(--ink-soft);
}
.auto-banner .ab-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--warning);
  box-shadow: 0 0 0 4px rgba(245,166,35,0.2);
  animation: abpulse 1.6s ease-in-out infinite;
}
@keyframes abpulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(245,166,35,0.2); }
  50%     { box-shadow: 0 0 0 7px rgba(245,166,35,0.05); }
}

/* ============ 大屏数字 stats ============ */
.stat-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.stat-card {
  background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 14px;
}
.stat-card .label {
  font-size: 11px; color: var(--muted); font-weight: 500;
  margin-bottom: 6px;
}
.stat-card .value {
  font-size: 22px; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.stat-card .delta {
  font-size: 11.5px; margin-top: 4px;
  font-weight: 500;
}
.delta.up { color: var(--success); }
.delta.down { color: var(--danger); }
.delta.flat { color: var(--muted); }

/* ============ 任务分发树状图 ============ */
.dispatch-tree {
  padding: 24px; background: #fff;
  border-radius: var(--radius-md);
  border: 1px solid var(--line);
}
.tree-level {
  display: flex; justify-content: center; gap: 12px;
  margin-bottom: 14px; position: relative;
}
.tree-node {
  padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--pale); color: var(--ink);
  font-size: 12px; font-weight: 500;
  min-width: 110px; text-align: center;
  border: 1px solid var(--line);
  opacity: 0; transform: translateY(-8px);
  transition: all 0.5s;
}
.tree-node.reveal { opacity: 1; transform: translateY(0); }
.tree-node.root {
  background: var(--accent); color: #fff;
  font-size: 14px; font-weight: 600; padding: 14px 24px;
  border-color: var(--accent);
  box-shadow: var(--shadow-md);
}
.tree-node.level-1 { background: var(--navy); color: #fff; border-color: var(--navy); }
.tree-node.level-2 { background: #fff; border-color: var(--navy); color: var(--navy); border-width: 1.5px; }
.tree-node.level-3 { background: #fff; border: 1px dashed var(--line-dark); }
.tree-line {
  width: 1px; height: 20px; background: var(--line-dark);
  margin: 0 auto;
}

/* ============ Toast 切换视角 ============ */
.role-switch-overlay {
  position: fixed; inset: 0;
  background: rgba(15,24,53,0.85);
  display: flex; align-items: center; justify-content: center;
  z-index: 200;
  animation: fadeIn 0.3s ease-out;
}
.role-switch-card {
  background: #fff; border-radius: var(--radius-lg);
  padding: 40px 48px; max-width: 480px;
  text-align: center;
  box-shadow: var(--shadow-lg);
}
.role-switch-card .ic {
  width: 64px; height: 64px; margin: 0 auto 16px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--navy) 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: #fff;
}
.role-switch-card h2 { margin: 0 0 8px; font-size: 20px; color: var(--ink); }
.role-switch-card p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
.role-switch-progress {
  height: 4px; background: var(--pale); border-radius: 2px; overflow: hidden;
}
.role-switch-progress .f {
  height: 100%; background: var(--accent);
  width: 0; animation: fillBar 1.6s ease-out forwards;
}
@keyframes fillBar { to { width: 100%; } }

/* ============ 通用工具类 ============ */
.flex { display: flex; }
.flex-col { display: flex; flex-direction: column; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
.mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; } .mt-4 { margin-top: 16px; }
.mb-2 { margin-bottom: 8px; } .mb-3 { margin-bottom: 12px; } .mb-4 { margin-bottom: 16px; }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--muted); }
.text-accent { color: var(--accent); }
.text-navy { color: var(--navy); }
.font-semibold { font-weight: 600; }
.font-bold { font-weight: 700; }
.w-full { width: 100%; }

/* 开场封面 */
.cover-wrap {
  height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 50%, #2C1855 100%);
  position: relative; overflow: hidden;
}
.cover-wrap::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 20% 30%, rgba(240,78,35,0.15) 0%, transparent 40%),
                    radial-gradient(circle at 80% 70%, rgba(100,140,255,0.12) 0%, transparent 40%);
}
.cover-content { max-width: 720px; text-align: center; position: relative; z-index: 1; color: #fff; padding: 40px; }
.cover-logo {
  width: 72px; height: 72px; margin: 0 auto 24px;
  background: linear-gradient(135deg, var(--accent) 0%, #E0390C 100%);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 36px; font-weight: 700; color: #fff;
  box-shadow: 0 8px 32px rgba(240,78,35,0.4);
}
.cover-title { font-size: 38px; font-weight: 700; margin: 0 0 10px; letter-spacing: 1px; }
.cover-subtitle { font-size: 16px; color: #CADCFC; margin: 0 0 30px; line-height: 1.6; }
.cover-narrative {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
  border-left: 3px solid var(--accent);
  padding: 18px 20px; border-radius: 10px;
  text-align: left; color: #E2E7F3; font-size: 14px; line-height: 1.8;
  margin-bottom: 30px;
}
.cover-narrative strong { color: #fff; }
.cover-cast {
  display: flex; justify-content: center; gap: 24px;
  margin-bottom: 30px;
}
.cover-cast .cast-item { text-align: center; }
.cover-cast .cast-avatar {
  width: 56px; height: 56px; margin: 0 auto 6px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; background: rgba(255,255,255,0.1);
  border: 2px solid rgba(255,255,255,0.2);
}
.cover-cast .cast-name { font-size: 12px; color: #CADCFC; }

/* Summary 尾声样式 */
.summary-wrap {
  height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #fff 0%, var(--pale) 100%);
  padding: 40px;
}
.summary-content { max-width: 900px; width: 100%; }
.summary-title {
  font-size: 28px; font-weight: 700; text-align: center;
  color: var(--navy); margin: 0 0 8px;
}
.summary-subtitle {
  font-size: 15px; text-align: center; color: var(--muted);
  margin: 0 0 28px;
}
.summary-big-stat {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: #fff; padding: 30px; border-radius: var(--radius-lg);
  text-align: center; margin-bottom: 24px;
}
.summary-big-stat .lbl { font-size: 13px; color: #CADCFC; margin-bottom: 8px; }
.summary-big-stat .val { font-size: 48px; font-weight: 700; color: #fff; }
.summary-big-stat .val .unit { font-size: 20px; color: var(--accent); margin-left: 4px; }
.summary-promise-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
}
.summary-promise {
  background: #fff; border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-md); padding: 16px;
}
.summary-promise .who { font-size: 11px; color: var(--accent); font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
.summary-promise .what { font-size: 13.5px; color: var(--ink); line-height: 1.6; }

/* 任务列表 */
.task-item {
  padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: #fff;
  margin-bottom: 8px; cursor: pointer;
  transition: all 0.15s;
}
.task-item:hover { border-color: var(--line-dark); background: #FAFBFE; }
.task-item.active { border-color: var(--accent); background: var(--accent-soft); }
.task-item.new {
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(240,78,35,0.08);
  animation: bounce 1.4s ease-in-out 2;
}
.task-item .ti-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.task-item .ti-title { font-size: 12.5px; font-weight: 600; color: var(--ink); flex: 1; }
.task-item .ti-sub { font-size: 11px; color: var(--muted); line-height: 1.5; }

/* 小二首页 dashboard */
.xiao-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
  color: #fff; padding: 20px 24px; border-radius: var(--radius-md);
  margin-bottom: 16px; position: relative; overflow: hidden;
}
.xiao-header::after {
  content: ''; position: absolute; right: -20px; top: -20px;
  width: 200px; height: 200px; border-radius: 50%;
  background: radial-gradient(circle, rgba(240,78,35,0.2) 0%, transparent 70%);
}
.xiao-header .greet { font-size: 13px; color: #CADCFC; margin-bottom: 4px; }
.xiao-header .name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.xiao-header .sub { font-size: 12.5px; color: #CADCFC; }

/* 章鱼路由卡特殊样式 */
.routing-card {
  background: linear-gradient(180deg, #FFF6F2 0%, #fff 50%);
  border: 1px solid var(--accent-soft);
  border-radius: var(--radius-md);
  padding: 14px;
}
.routing-experts {
  display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
}
.routing-expert-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; background: #fff;
  border: 1px solid var(--line); border-radius: 20px;
  font-size: 12px;
}
.routing-expert-chip.active {
  border-color: var(--accent); background: var(--accent-soft);
}
.routing-expert-chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted-soft);
}
.routing-expert-chip.active .dot {
  background: var(--accent); animation: pulse 1.2s ease-in-out infinite;
}
.routing-expert-chip.done .dot { background: var(--success); }

/* 冲突裁决双列对比 */
.conflict-compare {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin: 12px 0;
}
.conflict-opt {
  padding: 12px; background: #fff; border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
}
.conflict-opt.recommended {
  border-color: var(--success); background: #F0FDF4;
  box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
  position: relative;
}
.conflict-opt.recommended::before {
  content: '章鱼推荐'; position: absolute; top: -9px; right: 10px;
  background: var(--success); color: #fff;
  padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
}
.conflict-opt .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.conflict-opt .price { font-size: 22px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
.conflict-opt .reason { font-size: 11.5px; color: var(--ink-soft); line-height: 1.5; }

/* 可选按钮组（冲突裁决决策） */
.btn-group-inline {
  display: flex; gap: 8px; margin-top: 10px;
}
.btn-decision {
  flex: 1; padding: 8px 12px; border-radius: 6px;
  background: #fff; border: 1.5px solid var(--line);
  font-size: 12.5px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.btn-decision:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn-decision.primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn-decision.primary:hover { background: var(--accent-deep); }

/* 结果卡 */
.result-card {
  background: linear-gradient(135deg, #F0FDF4 0%, #fff 60%);
  border: 1.5px solid var(--success);
  border-radius: var(--radius-md); padding: 16px;
}
.result-card .rc-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.result-card .rc-icon {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--success); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.result-card .rc-title { font-size: 14px; font-weight: 600; color: var(--success); }
.result-metric-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-top: 10px;
}
.result-metric {
  padding: 10px; background: #fff; border-radius: 6px; text-align: center;
}
.result-metric .lbl { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.result-metric .val { font-size: 16px; font-weight: 700; color: var(--success); }

/* Leader 看板目标进度 */
.goal-progress-card {
  background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 20px;
}
.gp-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 16px;
}
.gp-head .title { font-size: 15px; font-weight: 600; color: var(--navy); }
.gp-head .target { font-size: 12px; color: var(--muted); }
.gp-values {
  display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px;
}
.gp-values .current {
  font-size: 36px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.gp-values .current.updating { animation: bounce 0.6s ease; }
.gp-values .slash { font-size: 20px; color: var(--muted-soft); }
.gp-values .goal { font-size: 18px; color: var(--muted); font-weight: 500; }
.gp-bar {
  height: 12px; background: var(--pale); border-radius: 6px; overflow: hidden;
}
.gp-bar .fill {
  height: 100%; background: linear-gradient(90deg, var(--accent) 0%, #FF7D55 100%);
  width: 0; transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
  border-radius: 6px;
}

/* 小任务行（Leader 看板） */
.exec-log-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-bottom: 1px solid var(--line);
  font-size: 12.5px;
}
.exec-log-item:last-child { border-bottom: none; }
.exec-log-item .city {
  font-weight: 600; color: var(--navy); min-width: 70px;
}
.exec-log-item .action { flex: 1; color: var(--ink-soft); }
.exec-log-item .time { color: var(--muted); font-size: 11px; }

/* 尾声关键数字 */
.wow-stat {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  margin-bottom: 20px;
}
.wow-stat-item {
  background: #fff; border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 18px; text-align: center;
}
.wow-stat-item .v {
  font-size: 30px; font-weight: 700; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.wow-stat-item .l { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* 滚动条美化 */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-dark); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted-soft); }
</style>

<body>

<div id="app">

  <!-- 顶部 AppBar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">超</div>
      <span class="name">超喵</span>
      <span class="tag">端到端产品原型 · Demo v1</span>
    </div>
    <div class="role-indicator" id="roleIndicator">
      <span class="role-icon">🎬</span>
      <span class="role-name">开场</span>
    </div>
    <div class="controls">
      <button class="btn btn-ghost" id="btnPrev" onclick="goPrev()">← 上一步</button>
      <button class="btn btn-primary" id="btnNext" onclick="goNext()">下一步 →</button>
      <button class="btn btn-ghost" onclick="restart()">↻ 重演</button>
    </div>
  </header>

  <!-- 剧情进度条 -->
  <div class="storybar" id="storybar">
    <div class="story-act" data-act="0"><span class="num">0</span><span>开场</span></div>
    <div class="story-act" data-act="1"><span class="num">1</span><span>平台识别 gap · Leader 授权</span></div>
    <div class="story-act" data-act="2"><span class="num">2</span><span>任务分发到小二</span></div>
    <div class="story-act" data-act="3"><span class="num">3</span><span>多专家协同执行</span></div>
    <div class="story-act" data-act="4"><span class="num">4</span><span>回到 Leader 看板</span></div>
    <div class="story-act" data-act="5"><span class="num">★</span><span>尾声</span></div>
  </div>

  <!-- 舞台 -->
  <main id="stage"></main>

</div>

<!-- 旁白浮窗 -->
<div class="narrator" id="narrator">
  <button class="nar-close" onclick="toggleNarrator()">×</button>
  <div class="nar-title">💡 此刻正在发生</div>
  <div class="nar-body" id="narBody">欢迎来到「超喵」端到端产品原型演示。</div>
</div>

<script>
/* ============ 状态管理 ============ */
const state = {
  stepIdx: 0,
  selectedStrategy: null,   // 'A' | 'B' | 'C'
  conflictResolved: false,
  conflictChoice: null,     // 'price' | 'margin'
  narratorVisible: true
};

/* ============ 剧本定义 ============ */
const STEPS = []; // 将在下面填入

/* ============ 渲染函数 ============ */
function render() {
  const step = STEPS[state.stepIdx];
  if (!step) return;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  const scene = document.createElement('div');
  scene.className = 'scene';
  scene.innerHTML = step.html();
  stage.appendChild(scene);
  if (step.afterMount) step.afterMount(scene);
  updateRoleIndicator(step.role);
  updateStoryBar(step.act);
  updateNarrator(step.narrator);
  updateControls();
}
function updateRoleIndicator(role) {
  const el = document.getElementById('roleIndicator');
  const map = {
    'intro':   { icon: '🎬', name: '开场' },
    'leader':  { icon: '👔', name: 'Leader 视角 · 张总（猫超总）' },
    'system':  { icon: '🐙', name: '系统视角 · 任务分发中' },
    'xiaoer':  { icon: '🧑‍💼', name: '小二视角 · 李华（华东生鲜）' },
    'summary': { icon: '🏁', name: '演示结束' }
  };
  const m = map[role] || map['intro'];
  el.innerHTML = `<span class="role-icon">${m.icon}</span><span class="role-name">${m.name}</span>`;
}
function updateStoryBar(act) {
  document.querySelectorAll('.story-act').forEach(el => {
    const a = parseInt(el.dataset.act, 10);
    el.classList.remove('active', 'passed');
    if (a === act) el.classList.add('active');
    else if (a < act) el.classList.add('passed');
  });
}
function updateNarrator(text) {
  if (!text) return;
  document.getElementById('narBody').innerHTML = text;
}
function updateControls() {
  document.getElementById('btnPrev').disabled = state.stepIdx === 0;
  const lastIdx = STEPS.length - 1;
  const nextBtn = document.getElementById('btnNext');
  if (state.stepIdx === lastIdx) {
    nextBtn.disabled = true;
    nextBtn.innerText = '✓ 演示已结束';
  } else {
    nextBtn.disabled = false;
    const step = STEPS[state.stepIdx];
    nextBtn.innerText = step.nextLabel || '下一步 →';
    nextBtn.disabled = !!step.nextBlocked;
  }
}
function toggleNarrator() {
  const el = document.getElementById('narrator');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function goNext() {
  if (state.stepIdx < STEPS.length - 1) {
    state.stepIdx++;
    render();
  }
}
function goPrev() {
  if (state.stepIdx > 0) {
    state.stepIdx--;
    render();
  }
}
function restart() {
  state.stepIdx = 0;
  state.selectedStrategy = null;
  state.conflictResolved = false;
  state.conflictChoice = null;
  render();
}

/* 解除下一步按钮封锁（在需要用户先操作时调用） */
function unblockNext() {
  STEPS[state.stepIdx].nextBlocked = false;
  updateControls();
}

function animateExpertsThinking(el) {
  const experts = [
    { id:'biz',    avatar:'📊', name:'经营分析专家', sub:'目标追踪 · 异常识别 · 归因分析' },
    { id:'goods',  avatar:'🛒', name:'商品经营专家', sub:'宫格规划 · 选品 · 链接诊断' },
    { id:'mkt',    avatar:'🎯', name:'增长营销专家', sub:'场景活动 · 权益设计 · 城市经营' },
    { id:'supply', avatar:'📦', name:'供应链计划专家', sub:'网络规划 · 补货 · 库存健康' },
    { id:'price',  avatar:'💰', name:'价格管理专家', sub:'价格查询 · 诊断 · 合规管控' }
  ];
  const host = el.querySelector('#expertList');
  experts.forEach((ex, i) => {
    const row = document.createElement('div');
    row.className = 'expert-row';
    row.style.opacity = '0';
    row.innerHTML = `
      <div class="exr-head" onclick="toggleExpertDetail('${ex.id}')">
        <div class="agent-avatar expert thinking">${ex.avatar}</div>
        <div style="flex:1; min-width:0;">
          <div class="font-semibold text-sm">${ex.name}</div>
          <div class="text-xs text-muted mt-1">${ex.sub}</div>
        </div>
        <div class="exr-status" id="st-${ex.id}">
          <span class="spinner" style="color: var(--accent);"></span>
          <span>分析中...</span>
        </div>
        <span class="exr-caret" id="ca-${ex.id}" style="opacity:0;">›</span>
      </div>
      <div class="exr-detail" id="dt-${ex.id}">
        ${renderExpertDetail(ex.id)}
      </div>
    `;
    host.appendChild(row);
    setTimeout(() => { row.style.transition = 'opacity 0.3s'; row.style.opacity = '1'; }, i * 180);
    setTimeout(() => {
      const st = row.querySelector(`#st-${ex.id}`);
      const ca = row.querySelector(`#ca-${ex.id}`);
      if (st) st.innerHTML = '<span style="color: var(--success); font-weight:600;">✓ 已返回建议</span><span class="text-xs text-muted" style="margin-left:6px;">点击查看详情</span>';
      if (ca) ca.style.opacity = '1';
      row.querySelector('.agent-avatar').classList.remove('thinking');
      row.classList.add('ready');
    }, 1400 + i * 260);
  });
}

function renderExpertDetail(id) {
  const o = EXPERT_OUTPUTS[id];
  if (!o) return '';
  return `
    <div class="exr-detail-inner">
      <div class="exd-row">
        <div class="exd-label">诊断结论</div>
        <div class="exd-value">${o.diagnosis}</div>
      </div>
      <div class="exd-row">
        <div class="exd-label">判断依据</div>
        <div class="exd-value text-muted">${o.evidence}</div>
      </div>
      <div class="exd-row">
        <div class="exd-label">建议动作</div>
        <div class="exd-value">
          <ul class="exd-list">
            ${o.actions.map(a => `<li>${a}</li>`).join('')}
          </ul>
        </div>
      </div>
      <div class="exd-grid">
        <div>
          <div class="exd-label">预估影响</div>
          <div class="exd-value" style="color:var(--success); font-weight:600;">${o.impact}</div>
        </div>
        <div>
          <div class="exd-label">风险点</div>
          <div class="exd-value" style="color:var(--ink-soft);">${o.risks}</div>
        </div>
        <div>
          <div class="exd-label">置信度</div>
          <div class="exd-confidence">
            <div class="exd-conf-bar"><div class="fill" style="width:${o.confidence}%"></div></div>
            <span>${o.confidence}%</span>
          </div>
        </div>
      </div>
    </div>
  `;
}

function toggleExpertDetail(id) {
  const row = document.querySelector(`#dt-${id}`);
  if (!row) return;
  const parent = row.closest('.expert-row');
  if (!parent || !parent.classList.contains('ready')) return;
  parent.classList.toggle('expanded');
}
window.toggleExpertDetail = toggleExpertDetail;

function expertCardHtml(ex, idx) {
  const ef = (label, val) => `<div class="expert-field"><div class="ef-label">${label}</div><div class="ef-value">${val}</div></div>`;
  const chipConf = ex.needsConfirm
    ? '<span class="chip chip-warning">需确认</span>'
    : '<span class="chip chip-success">可执行</span>';
  const chipConflict = ex.conflict ? '<span class="chip chip-danger">⚠ 与其他专家冲突</span>' : '';
  // Default: collapsed；冲突卡默认展开以提醒用户
  const uid = 'tex-' + (idx ?? Math.random().toString(36).slice(2,7));
  const expandedClass = ex.conflict ? ' expanded' : '';
  return `
    <div class="msg expert collapsible${expandedClass}" id="${uid}">
      <div class="msg-body">
        <div class="msg-meta" onclick="toggleTaskExpert('${uid}')" style="cursor:pointer;">
          <div class="agent-avatar expert sm">${ex.avatar}</div>
          <span class="name">${ex.name}</span>
          ${chipConf}
          ${chipConflict}
          <span class="time">置信度 ${ex.confidence}</span>
          <span class="exr-caret" style="margin-left:auto; font-size:20px; color:var(--muted);">›</span>
        </div>
        <div class="msg-content msg-collapsible-body">
          ${ef('诊断结论', ex.diagnosis)}
          ${ef('建议动作', ex.actions)}
          ${ef('预估影响', ex.impact)}
          ${ef('风险点', ex.risks)}
        </div>
      </div>
    </div>
  `;
}

        v += 0.07;
        if (v > target) v = target;
        current.innerText = v.toFixed(1);

        if (trend) trend.innerText = '↑ 本批执行拉动 +2.1 亿（+5%）';
      }
    };
    step();
  }, 800);
