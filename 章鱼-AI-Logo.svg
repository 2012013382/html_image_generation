<svg viewBox="0 0 600 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="n_body" cx="0.38" cy="0.3" r="0.68">
      <stop offset="0%" stop-color="#b8e6ff"/>
      <stop offset="28%" stop-color="#7c6fe0"/>
      <stop offset="58%" stop-color="#4a30a0"/>
      <stop offset="88%" stop-color="#1e0e55"/>
      <stop offset="100%" stop-color="#120835"/>
    </radialGradient>
    <radialGradient id="n_rim" cx="0.8" cy="0.82" r="0.4">
      <stop offset="0%" stop-color="#ff6eb4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff6eb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="n_hi" cx="0.4" cy="0.22" r="0.28">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="n_sh" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#120835" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#120835" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="n_tg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1570"/>
      <stop offset="100%" stop-color="#ff6eb4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="n_tg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#321a80"/>
      <stop offset="100%" stop-color="#74b9ff" stop-opacity="0.35"/>
    </linearGradient>
    <style>
      @keyframes breathe {
        0%, 100% { transform: translateY(0) scaleX(1) scaleY(1); }
        35% { transform: translateY(-18px) scaleX(1.05) scaleY(0.93); }
        55% { transform: translateY(-12px) scaleX(0.97) scaleY(1.04); }
        70% { transform: translateY(-16px) scaleX(1.02) scaleY(0.97); }
      }
      .body-group {
        transform-origin: 300px 380px;
        animation: breathe 2.8s ease-in-out infinite;
      }
      @keyframes shadowPulse {
        0%, 100% { rx: 110; ry: 14; opacity: 0.7; }
        35% { rx: 125; ry: 18; opacity: 0.35; }
        55% { rx: 105; ry: 13; opacity: 0.8; }
        70% { rx: 118; ry: 16; opacity: 0.45; }
      }
      .shadow { animation: shadowPulse 2.8s ease-in-out infinite; }
      @keyframes blink {
        0%, 35%, 43%, 100% { transform: scaleY(1); }
        38%, 40% { transform: scaleY(0.04); }
      }
      .eye-l { transform-origin: 255px 262px; animation: blink 3.5s ease-in-out infinite; }
      .eye-r { transform-origin: 345px 262px; animation: blink 3.5s ease-in-out 0.06s infinite; }
      @keyframes lookAround {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(4px, -2px); }
        40% { transform: translate(-3px, 1px); }
        60% { transform: translate(2px, 3px); }
        80% { transform: translate(-4px, -1px); }
      }
      .pupil-l { animation: lookAround 6s ease-in-out infinite; }
      .pupil-r { animation: lookAround 6s ease-in-out infinite; }
      @keyframes irisGlow {
        0%, 100% { opacity: 0.2; stroke-width: 1; }
        50% { opacity: 0.8; stroke-width: 2.5; }
      }
      .ai-iris { animation: irisGlow 2.5s ease-in-out infinite; }
      @keyframes wave1 {
        0%, 100% { transform: rotate(0deg) translate(0, 0); }
        25% { transform: rotate(-12deg) translate(-6px, -4px); }
        50% { transform: rotate(3deg) translate(2px, 2px); }
        75% { transform: rotate(10deg) translate(5px, -2px); }
      }
      @keyframes wave2 {
        0%, 100% { transform: rotate(0deg) translate(0, 0); }
        25% { transform: rotate(12deg) translate(6px, -4px); }
        50% { transform: rotate(-3deg) translate(-2px, 2px); }
        75% { transform: rotate(-10deg) translate(-5px, -2px); }
      }
      @keyframes wave3 {
        0%, 100% { transform: rotate(0deg) translate(0, 0); }
        30% { transform: rotate(-8deg) translate(-4px, -3px); }
        60% { transform: rotate(6deg) translate(3px, 2px); }
      }
      @keyframes wave4 {
        0%, 100% { transform: rotate(0deg) translate(0, 0); }
        30% { transform: rotate(8deg) translate(4px, -3px); }
        60% { transform: rotate(-6deg) translate(-3px, 2px); }
      }
      @keyframes wave5 {
        0%, 100% { transform: rotate(0deg) translate(0, 0); }
        35% { transform: rotate(-6deg) translate(-3px, 2px); }
        65% { transform: rotate(5deg) translate(2px, -3px); }
      }
      @keyframes wave6 {
        0%, 100% { transform: rotate(0deg) translate(0, 0); }
        35% { transform: rotate(6deg) translate(3px, 2px); }
        65% { transform: rotate(-5deg) translate(-2px, -3px); }
      }
      .tent-1 { transform-origin: 158px 348px; animation: wave1 2.5s ease-in-out infinite; }
      .tent-2 { transform-origin: 442px 348px; animation: wave2 2.5s ease-in-out infinite; }
      .tent-3 { transform-origin: 205px 375px; animation: wave3 2.2s ease-in-out 0.2s infinite; }
      .tent-4 { transform-origin: 395px 375px; animation: wave4 2.2s ease-in-out 0.2s infinite; }
      .tent-5 { transform-origin: 260px 390px; animation: wave5 2s ease-in-out 0.4s infinite; }
      .tent-6 { transform-origin: 340px 390px; animation: wave6 2s ease-in-out 0.4s infinite; }
      @keyframes blushPop {
        0%, 100% { opacity: 0.08; rx: 14; }
        45% { opacity: 0.3; rx: 18; }
      }
      .blush { animation: blushPop 2.8s ease-in-out infinite; }
      @keyframes smileWiggle {
        0%, 100% { transform: scale(1); }
        35% { transform: scale(1.15) translateY(-2px); }
        55% { transform: scale(0.95); }
      }
      .smile { transform-origin: 300px 304px; animation: smileWiggle 2.8s ease-in-out infinite; }
      @keyframes shimmer {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.45; }
      }
      .hi-shimmer { animation: shimmer 2.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Shadow -->
  <ellipse cx="300" cy="530" rx="110" ry="14" fill="url(#n_sh)" class="shadow"/>

  <!-- Body group -->
  <g class="body-group">

    <!-- Tentacles -->
    <g class="tent-1">
      <path d="M158,348 C132,388 120,432 135,458 C148,478 165,465 162,440 C160,418 158,390 168,355" fill="url(#n_tg)"/>
    </g>
    <g class="tent-2">
      <path d="M442,348 C468,388 480,432 465,458 C452,478 435,465 438,440 C440,418 442,390 432,355" fill="url(#n_tg)"/>
    </g>
    <g class="tent-3">
      <path d="M205,375 C190,412 182,448 195,472 C206,490 224,480 222,456 C220,435 212,410 215,382" fill="#2a1570"/>
    </g>
    <g class="tent-4">
      <path d="M395,375 C410,412 418,448 405,472 C394,490 376,480 378,456 C380,435 388,410 385,382" fill="#2a1570"/>
    </g>
    <g class="tent-5">
      <path d="M260,390 C252,425 248,458 258,478 C268,492 282,484 280,464 C278,446 268,422 268,398" fill="url(#n_tg2)"/>
    </g>
    <g class="tent-6">
      <path d="M340,390 C348,425 352,458 342,478 C332,492 318,484 320,464 C322,446 332,422 332,398" fill="url(#n_tg2)"/>
    </g>

    <!-- Body -->
    <ellipse cx="300" cy="268" rx="148" ry="138" fill="url(#n_body)"/>
    <ellipse cx="300" cy="268" rx="148" ry="138" fill="url(#n_rim)"/>
    <ellipse cx="278" cy="212" rx="72" ry="48" fill="url(#n_hi)" class="hi-shimmer"/>

    <!-- Left eye -->
    <g class="eye-l">
      <ellipse cx="255" cy="262" rx="30" ry="32" fill="white"/>
      <g class="pupil-l">
        <ellipse cx="261" cy="266" rx="17" ry="19" fill="#0a0520"/>
        <circle cx="261" cy="266" r="11" fill="none" stroke="#00f5d4" stroke-width="1.5" class="ai-iris"/>
        <circle cx="261" cy="268" r="2" fill="#00f5d4" opacity="0.6"/>
        <circle cx="270" cy="255" r="8" fill="white"/>
        <circle cx="255" cy="273" r="3.5" fill="white" opacity="0.5"/>
      </g>
    </g>

    <!-- Right eye -->
    <g class="eye-r">
      <ellipse cx="345" cy="262" rx="30" ry="32" fill="white"/>
      <g class="pupil-r">
        <ellipse cx="351" cy="266" rx="17" ry="19" fill="#0a0520"/>
        <circle cx="351" cy="266" r="11" fill="none" stroke="#00f5d4" stroke-width="1.5" class="ai-iris"/>
        <circle cx="351" cy="268" r="2" fill="#00f5d4" opacity="0.6"/>
        <circle cx="360" cy="255" r="8" fill="white"/>
        <circle cx="345" cy="273" r="3.5" fill="white" opacity="0.5"/>
      </g>
    </g>

    <!-- Blush -->
    <ellipse cx="218" cy="290" rx="14" ry="8" fill="#ff6eb4" class="blush"/>
    <ellipse cx="382" cy="290" rx="14" ry="8" fill="#ff6eb4" class="blush"/>

    <!-- Smile -->
    <g class="smile">
      <path d="M286,300 Q300,314 314,300" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>

  </g>
</svg>